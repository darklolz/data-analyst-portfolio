<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Student Performance Dashboard</title>
  <desc id="desc">Student academic performance analytics dashboard.</desc>

  <!-- Background -->
  <rect width="960" height="600" fill="#071426"/>

  <!-- Main Container -->
  <rect x="58" y="54" width="844" height="492" rx="20"
        fill="#0d1f38" stroke="#24415f"/>

  <!-- Title -->
  <text x="92" y="116" fill="#eaf6ff"
        font-family="Inter, Arial"
        font-size="34"
        font-weight="700">
        Student Performance Dashboard
  </text>

  <!-- Donut Chart: Grade Distribution -->
  <circle cx="270" cy="320" r="132"
          fill="none"
          stroke="#22d3ee"
          stroke-width="42"/>

  <path d="M270 188a132 132 0 0 1 113 200"
        fill="none"
        stroke="#8b5cf6"
        stroke-width="42"/>

  <path d="M383 388a132 132 0 0 1-210 22"
        fill="none"
        stroke="#34d399"
        stroke-width="42"/>

  <text x="235" y="325"
        fill="#ffffff"
        font-size="30"
        font-family="Inter, Arial"
        font-weight="700">
        89%
  </text>

  <text x="205" y="355"
        fill="#9db8d4"
        font-size="14"
        font-family="Inter, Arial">
        Avg Score
  </text>

  <!-- Subject Performance Bars -->
  <g transform="translate(520 165)">
    <text x="0" y="-15"
          fill="#ffffff"
          font-size="20"
          font-family="Inter, Arial"
          font-weight="600">
          Subject Scores
    </text>

    <!-- Mathematics -->
    <text x="0" y="25"
          fill="#cbd5e1"
          font-size="14">Mathematics</text>
    <rect y="35" width="270" height="34" rx="10" fill="#122a49"/>
    <rect y="35" width="240" height="34" rx="10" fill="#22d3ee"/>

    <!-- Science -->
    <text x="0" y="97"
          fill="#cbd5e1"
          font-size="14">Science</text>
    <rect y="107" width="270" height="34" rx="10" fill="#122a49"/>
    <rect y="107" width="220" height="34" rx="10" fill="#8b5cf6"/>

    <!-- English -->
    <text x="0" y="169"
          fill="#cbd5e1"
          font-size="14">English</text>
    <rect y="179" width="270" height="34" rx="10" fill="#122a49"/>
    <rect y="179" width="250" height="34" rx="10" fill="#34d399"/>

    <!-- Social Studies -->
    <text x="0" y="241"
          fill="#cbd5e1"
          font-size="14">Social Studies</text>
    <rect y="251" width="270" height="34" rx="10" fill="#122a49"/>
    <rect y="251" width="190" height="34" rx="10" fill="#38bdf8"/>
  </g>

  <!-- KPI Cards -->
  <g transform="translate(92 145)">
    <rect width="120" height="70" rx="12" fill="#122a49"/>
    <text x="20" y="28" fill="#9db8d4" font-size="13">Attendance</text>
    <text x="20" y="55" fill="#22d3ee" font-size="24" font-weight="700">95%</text>
  </g>

  <g transform="translate(230 145)">
    <rect width="120" height="70" rx="12" fill="#122a49"/>
    <text x="20" y="28" fill="#9db8d4" font-size="13">Assignments</text>
    <text x="20" y="55" fill="#34d399" font-size="24" font-weight="700">42</text>
  </g>

  <g transform="translate(368 145)">
    <rect width="120" height="70" rx="12" fill="#122a49"/>
    <text x="20" y="28" fill="#9db8d4" font-size="13">Rank</text>
    <text x="20" y="55" fill="#facc15" font-size="24" font-weight="700">#5</text>
  </g>

</svg>
